<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalori Serisi</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#3CCB5A"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF3F6;--card:#fff;--ink:#10263F;--mute:#5F7285;--line:#D3DEE6;--g:#3CCB5A;--gd:#2BA244;--b:#17A8F0;--bd:#1288C4;--o:#FF9F1A;--r:#FF4F5E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1A2B;--card:#13263B;--ink:#E8F0F7;--mute:#8CA3B8;--line:#26405A}}
:root[data-theme="dark"]{--bg:#0C1A2B;--card:#13263B;--ink:#E8F0F7;--mute:#8CA3B8;--line:#26405A}
[data-pal="cini"]{--g:#12A39B;--gd:#0C7F79;--b:#3B6FD0;--bd:#2A55A8;--o:#E8553E;--r:#C23A2B}
.brand{display:flex;align-items:center;gap:10px;font-size:20px}.lg{width:40px;height:40px;border-radius:12px;object-fit:cover}
.stats{display:flex;gap:8px;margin:6px 0 4px;flex-wrap:wrap}.pill{display:flex;align-items:center;gap:6px;font-weight:800;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 12px}
.pg.in{animation:sl .35s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{opacity:0;transform:translateX(28px)}}
@keyframes ring{from{stroke-dashoffset:326.7}}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg)}60%{transform:scale(1.2) rotate(8deg)}100%{transform:none}}
.st.pop{animation:pop .7s}
.cel{align-items:center;background:rgba(8,18,30,.86)}.pop2{text-align:center;color:#fff;max-width:320px;padding:24px;animation:pop .5s}.pop2 h2{font-size:30px;margin:8px 0 4px}.pop2 p{margin:0 0 12px;opacity:.85}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:700 16px 'Bricolage Grotesque',system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:8px 16px 110px}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.top,.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-weight:800;font-size:18px;display:flex;align-items:center;gap:6px}
.ic{background:none;border:2px solid var(--line);border-radius:12px;font-size:20px;padding:4px 8px;cursor:pointer}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:13px 16px;font-weight:800;color:#fff;background:var(--g);box-shadow:0 4px 0 var(--gd);cursor:pointer;margin-top:10px}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.b{background:var(--b);box-shadow:0 4px 0 var(--bd)}
.btn.s{background:var(--card);color:var(--b);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bar{height:14px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .5s}
.ent{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px solid var(--line);margin-top:8px}
.ent img,.ph{width:48px;height:48px;border-radius:12px;object-fit:cover;background:var(--line);display:grid;place-items:center}
.x{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:8px}
small{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.dy{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--mute);font-size:13px}
.dy.on{background:var(--g);border-color:var(--g);color:#fff}
.dy.td{border-color:var(--b)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.gal figure{margin:0}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.gal figcaption{font-size:12px;color:var(--mute);text-align:center}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bd{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:4px}
.bd.off{opacity:.55}
input[type=range]{padding:0;border:0;accent-color:var(--g)}
input{width:100%;box-sizing:border-box;padding:12px;margin-top:10px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;box-sizing:border-box}
.sheet h3{margin:0 0 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;max-width:130px;background:none;border:0;color:var(--mute);font-weight:900;font-size:12px;padding:8px 0;cursor:pointer}
nav button span{display:grid;place-items:center;height:28px}.i{flex:none}.st{width:64px;height:64px;margin:0 auto;display:grid;place-items:center;background:var(--line);color:var(--mute);clip-path:polygon(50% 0,61% 20%,85% 15%,80% 39%,100% 50%,80% 61%,85% 85%,61% 80%,50% 100%,39% 80%,15% 85%,20% 61%,0 50%,20% 39%,15% 15%,39% 20%)}.st.on{background:var(--o);color:#fff}.ph{color:var(--mute)}
nav button.on{color:var(--b)}
#tt{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-150%);background:var(--g);color:#fff;font-weight:800;padding:10px 18px;border-radius:12px;box-shadow:0 4px 0 var(--gd);transition:transform .3s;z-index:99;max-width:90%;text-align:center}
#tt.show{transform:translate(-50%,0)}
.cf{position:fixed;top:40%;left:50%;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:98;animation:f 1s ease-out forwards}
@keyframes f{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div><nav id="nav"></nav><div id="ov"></div><div id="tt" role="status"></div>
<script>
const API='https://kaloritakip.uygaralrans.workers.dev/';
const $=s=>document.querySelector(s),K='kalori-v1';
let S={goal:2000,theme:'auto',pal:'canli',xp:0,entries:[],badges:[],q:{}},tab='today',draft={},fx=false,fresh=[];
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
let sx=S.xp;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Depolama dolu, eski kayıtları sil')}};
const day=d=>(d||new Date()).toLocaleDateString('sv'),lvlOf=x=>Math.floor(x/100)+1;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',flame:'M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z',trophy:'M8 4h8v6a4 4 0 0 1-8 0zM8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 14v4M8 21h8',gear:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2',sun:'M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM12 1v3M12 20v3M1 12h3M20 12h3M4 4l2 2M18 18l2 2M20 4l-2 2M6 18l-2 2',moon:'M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z',auto:'M12 3a9 9 0 1 0 0 18zM12 3a9 9 0 0 1 0 18',camera:'M4 8h3l2-3h6l2 3h3v11H4zM12 11a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z',sunrise:'M3 18h18M7 18a5 5 0 0 1 10 0M12 6v4M5 10l2 2M19 10l-2 2',cup:'M5 8h12v5a6 6 0 0 1-12 0zM17 9h2a2 2 0 0 1 0 5h-2M6 21h10',target:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',lock:'M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3',plate:'M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',bolt:'M13 2L5 14h6l-1 8 8-12h-6z',leaf:'M5 19C5 9 10 5 20 4c0 10-4 15-14 15zM5 19l7-7',scale:'M12 4v16M6 20h12M4 8h16M7 8l-3 6a3.5 3.5 0 0 0 6 0zM17 8l-3 6a3.5 3.5 0 0 0 6 0z',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[n]}"/></svg>`;
function tulip(n){const g='var(--g)',c='var(--o)';return `<svg viewBox="0 0 120 130" width="150" height="150" role="img" aria-label="Lale aşaması ${n+1}/4" style="display:block;margin:0 auto"><ellipse cx="60" cy="118" rx="38" ry="8" fill="var(--line)"/>`+(n==0?`<circle cx="60" cy="108" r="6" fill="${c}"/>`:`<path d="M60 116V${n>1?64:84}" stroke="${g}" stroke-width="5" stroke-linecap="round"/><path d="M60 100C40 100 34 86 32 76C48 78 58 88 60 100Z" fill="${g}"/>${n>1?`<path d="M60 92C80 92 88 78 90 68C72 70 62 80 60 92Z" fill="${g}"/>`:''}`)+(n==2?`<path d="M60 66C46 66 44 46 60 30C76 46 74 66 60 66Z" fill="${c}"/>`:'')+(n==3?`<path d="M60 68C42 68 38 44 42 28C50 34 56 38 60 44C64 38 70 34 78 28C82 44 78 68 60 68Z" fill="${c}"/><path d="M60 68C52 62 50 50 60 36C70 50 68 62 60 68Z" fill="var(--b)" opacity=".85"/>`:'')+`</svg>`}
const MEALS=['Kahvaltı','Öğle','Akşam','Atıştırmalık'],ICON=['sunrise','sun','moon','cup'];
const FOODS=[['Simit',280],['Haşlanmış yumurta',78],['Ayran',90],['Pilav (1 porsiyon)',200],['Mercimek çorbası',150],['Muz',105],['Tavuk göğsü',165],['Ekmek (1 dilim)',80]];
const BD=[['leaf','İlk adım','İlk öğününü kaydet',s=>s.n>=1],['flame','3 gün seri','3 gün üst üste kayıt',s=>s.b>=3],['bolt','7 gün seri','Bir hafta bırakmadın',s=>s.b>=7],['star','30 gün seri','Bir ay üst üste',s=>s.b>=30],['camera','Fotoğrafçı','10 fotoğraflı öğün',s=>s.p>=10],['plate','Tam gün','Bir günde 3 farklı öğün',s=>s.m>=3],['scale','Dengeli gün','Günü hedefine yakın tamamla',s=>s.t],['trophy','50 kayıt','Toplam 50 öğün',s=>s.n>=50]];
function streak(){const ds=new Set(S.entries.map(e=>e.date));let d=new Date(),n=0;if(!ds.has(day(d)))d.setDate(d.getDate()-1);while(ds.has(day(d))){n++;d.setDate(d.getDate()-1)}return n}
function best(){const a=[...new Set(S.entries.map(e=>e.date))].sort();let b=0,c=0,p=null;for(const x of a){c=p&&new Date(x)-new Date(p)==864e5?c+1:1;b=Math.max(b,c);p=x}return b}
function stats(){const by={};S.entries.forEach(e=>(by[e.date]=by[e.date]||[]).push(e));const ds=Object.values(by);return{n:S.entries.length,b:best(),p:S.entries.filter(e=>e.photo).length,m:Math.max(0,...ds.map(a=>new Set(a.map(e=>e.meal)).size)),t:ds.some(a=>{const s=a.reduce((x,e)=>x+e.kcal,0);return a.length>=2&&s>=S.goal*.85&&s<=S.goal*1.1})}}
function checkBadges(){const s=stats(),nw=BD.filter(b=>!S.badges.includes(b[1])&&b[3](s));nw.forEach(b=>S.badges.push(b[1]));return nw}
function toast(m){const e=$('#tt');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function boom(){const c=['#12A39B','#1E4FA8','#E8553E','#F2B84B','#7FA8F2'];for(let i=0;i<28;i++){const s=document.createElement('i');s.className='cf';s.style.cssText=`background:${c[i%5]};--x:${(Math.random()-.5)*320}px;--y:${Math.random()*260-60}px;--r:${Math.random()*720}deg`;document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
function countUp(){const e=$('#xp');if(!e||sx===S.xp)return;const a=sx,b=S.xp,t0=performance.now();sx=b;(function f(t){const k=Math.min((t-t0)/700,1);e.textContent=Math.round(a+(b-a)*k);if(k<1)requestAnimationFrame(f)})(t0)}
function celebrate(t,m,n){$('#ov').innerHTML=`<div class="ov cel" onclick="closeAdd()"><div class="pop2">${tulip(n)}<h2>${t}</h2><p>${m}</p><button class="btn">Devam</button></div></div>`;boom()}
function setPal(p){S.pal=p;applyTheme();save();render()}
function applyTheme(){document.documentElement.dataset.pal=S.pal;S.theme==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',S.theme)}
function setTheme(t){S.theme=t;applyTheme();save();render()}
function cycle(){setTheme({auto:'light',light:'dark',dark:'auto'}[S.theme])}
function go(t){tab=t;fx=true;render();fresh=[];scrollTo(0,0)}
function shrink(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const sz=(m,q)=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)};cb(sz(360,.7),sz(900,.8))};i.src=r.result};r.readAsDataURL(f)}
function openAdd(i){draft={meal:i,photo:''};$('#ov').innerHTML=`<div class="ov" onclick="if(event.target===this)closeAdd()"><div class="sheet"><h3 class="chip">${ic(ICON[i])} ${MEALS[i]} ekle</h3><div class="chips">${FOODS.map((f,j)=>`<button class="tag" onclick="fill(${j})">${f[0]}</button>`).join('')}</div><input id="fn" placeholder="Yemek adı"><input id="fk" type="number" inputmode="numeric" placeholder="Kalori (kcal)"><label class="btn b">${ic('camera')} Fotoğraf ekle<input id="fp" type="file" accept="image/*" hidden onchange="photo(this)"></label><div id="pv"></div><div id="an"></div><button class="btn" onclick="add()">Kaydet</button></div></div>`}
function closeAdd(){$('#ov').innerHTML=''}
function fill(j){$('#fn').value=FOODS[j][0];$('#fk').value=FOODS[j][1]}
function photo(inp){const f=inp.files[0];if(!f)return;shrink(f,(d,b)=>{draft.photo=d;draft.big=b;draft.items=null;$('#an').innerHTML='';$('#pv').innerHTML=`<img src="${d}" style="width:100%;border-radius:14px;margin-top:10px" alt="Önizleme"><button class="btn b" onclick="analyze()">Tabağı analiz et</button>`})}
const tl=x=>`${Math.round(x.grams*x.m)} g, ${Math.round(x.kcal*x.m)} kcal${x.confidence==='low'?', emin değilim':''}`;
const sum=k=>draft.items.reduce((a,x)=>a+Math.round(x[k]*x.m),0);
const tot=()=>`<b>Toplam: ${sum('kcal')} kcal</b> <small>(${sum('kcal_min')}-${sum('kcal_max')})</small>`;
async function analyze(){const el=$('#an');el.innerHTML='<p>Tabak analiz ediliyor...</p>';
try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:draft.big.split(',')[1],mime:'image/jpeg'})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Analiz başarısız');
if(!d.items||!d.items.length){el.innerHTML='<p>Tabakta yemek bulamadım, elle ekleyebilirsin.</p>';return}
draft.items=d.items.map(x=>({...x,m:1}));drawItems()}catch(e){el.innerHTML=`<p>${esc(e.message==='Failed to fetch'?'Bağlantı kurulamadı':e.message)}. Elle ekleyebilirsin.</p>`}}
function drawItems(){const it=draft.items;if(!it.length){$('#an').innerHTML='<p>Liste boş, elle ekleyebilirsin.</p>';return}
$('#an').innerHTML=it.map((x,i)=>`<div class="card"><div class="row"><b>${esc(x.name)}</b><button class="x" onclick="rmItem(${i})" aria-label="Kaldır">✕</button></div><small id="g${i}">${tl(x)}</small><input type="range" min="0.5" max="2" step="0.25" value="${x.m}" oninput="setM(${i},this.value)" aria-label="Porsiyon"></div>`).join('')+`<p id="kt">${tot()}</p><small>Fotoğraftan tahmindir, porsiyonu kaydırıcıyla düzelt.</small><button class="btn" onclick="okItems()">Onayla ve ekle</button>`}
function setM(i,v){draft.items[i].m=+v;$('#g'+i).textContent=tl(draft.items[i]);$('#kt').innerHTML=tot()}
function rmItem(i){draft.items.splice(i,1);drawItems()}
function okItems(){const it=draft.items;if(!it||!it.length)return;const n=it.map(x=>x.name);$('#fn').value=n.slice(0,3).join(', ')+(n.length>3?'…':'');$('#fk').value=sum('kcal');add()}
function add(){const n=$('#fn').value.trim(),k=Math.round(+$('#fk').value);if(!n||!(k>0)){toast('Yemek adı ve kalori gir');return}
const t=day(),first=!S.entries.some(e=>e.date===t),pl=lvlOf(S.xp);
S.entries.push({id:Date.now(),date:t,meal:draft.meal,name:n,kcal:k,photo:draft.photo});
let g=10+(draft.photo?5:0)+(first?25:0);
if(new Set(S.entries.filter(e=>e.date===t).map(e=>e.meal)).size>=3&&!S.q[t]){S.q[t]=1;g+=30}
const nb=checkBadges();g+=nb.length*50;S.xp+=g;save();closeAdd();boom();
toast(`+${g} XP ${nb.map(b=>'Rozet: '+b[1]).join(' ')}`);
fresh=nb.map(b=>b[1]);render();if(lvlOf(S.xp)>pl)celebrate('Seviye '+lvlOf(S.xp),'Laleni büyüttün, devam!',Math.min(lvlOf(S.xp)-1,3));else if(first)setTimeout(()=>{const k=streak();celebrate(k+'. gün serisi','Bugünkü kaydın tamam',k<3?1:k<7?2:3)},700)}
function del(id){S.entries=S.entries.filter(e=>e.id!==id);save();render()}
function today(){const t=day(),te=S.entries.filter(e=>e.date===t),tot=te.reduce((a,e)=>a+e.kcal,0),p=tot/S.goal,C=326.7,left=S.goal-tot,m=new Set(te.map(e=>e.meal)).size;
return `<div class="card" style="text-align:center"><svg viewBox="0 0 120 120" width="190" height="190" role="img" aria-label="${tot} / ${S.goal} kcal"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="${p>1.1?'var(--o)':'var(--g)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(p,1))}" transform="rotate(-90 60 60)" style="animation:ring .9s cubic-bezier(.2,.8,.2,1)"/><text x="60" y="60" text-anchor="middle" font-size="24" font-weight="900" fill="var(--ink)">${tot}</text><text x="60" y="76" text-anchor="middle" font-size="9" fill="var(--mute)">/ ${S.goal} kcal</text></svg><div>${left>0?left+' kcal kaldı':left>-S.goal*.1?'Hedefe ulaştın!':-left+' kcal fazla, yarın yeni gün'}</div></div>
<div class="card"><div class="row"><b class="chip" style="font-size:16px">${ic('target')} Günlük görev: 3 farklı öğün</b><small>${Math.min(m,3)}/3</small></div><div class="bar" style="margin:10px 0 4px"><i style="width:${Math.min(m/3,1)*100}%;background:var(--o)"></i></div><small>Tamamla, +30 XP kazan</small></div>`+
MEALS.map((n,i)=>{const L=te.filter(e=>e.meal===i);return `<div class="card"><div class="row"><b class="chip" style="font-size:16px">${ic(ICON[i])} ${n}</b><small>${L.reduce((a,e)=>a+e.kcal,0)} kcal</small></div>${L.map(e=>`<div class="ent">${e.photo?`<img src="${e.photo}" alt="${esc(e.name)}">`:'<span class="ph">'+ic('plate')+'</span>'}<div style="flex:1"><b>${esc(e.name)}</b><br><small>${e.kcal} kcal</small></div><button class="x" onclick="del(${e.id})" aria-label="Sil">✕</button></div>`).join('')}<button class="btn s" onclick="openAdd(${i})">+ Ekle</button></div>`}).join('')}
function streakTab(){const st=streak(),ds=new Set(S.entries.map(e=>e.date));let cells='';for(let i=27;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=day(d);cells+=`<div class="dy ${ds.has(k)?'on':''} ${i==0?'td':''}">${ds.has(k)?'✓':d.getDate()}</div>`}
const ph=S.entries.filter(e=>e.photo).reverse().slice(0,30);
return `<div class="card" style="text-align:center">${tulip(st<1?0:st<3?1:st<7?2:3)}<div style="font-size:44px;font-weight:900;color:var(--o)">${st} gün</div><div>${st?'Seriyi sürdür, bugün de kaydet!':'Bugün ilk öğününü kaydet, seri başlasın'}</div><small>En uzun seri: ${best()} gün</small></div><div class="card"><b>Son 28 gün</b><div class="grid">${cells}</div></div><div class="card"><b>Yemek günlüğü</b>${ph.length?`<div class="gal">${ph.map(e=>`<figure><img src="${e.photo}" alt="${esc(e.name)}"><figcaption>${e.date.slice(5)}</figcaption></figure>`).join('')}</div>`:'<p>Öğünlerine fotoğraf ekle, burada birikir.</p>'}</div>`}
function rewards(){const lv=lvlOf(S.xp),r=S.xp%100;return `<div class="card" style="text-align:center">${tulip(Math.min(lv-1,3))}<b style="font-size:22px">Seviye ${lv}</b><div class="bar" style="margin:10px 0"><i style="width:${r}%;background:var(--b)"></i></div><small>Sonraki seviyeye ${100-r} XP</small></div><div class="card"><b>XP nasıl kazanılır?</b><p style="margin:6px 0 0">Öğün +10, fotoğraf +5, günün ilk kaydı +25, 3 farklı öğün +30, rozet +50</p></div><div class="badges">${BD.map(b=>{const on=S.badges.includes(b[1]);return `<div class="bd ${on?'':'off'}"><div class="st ${on?'on':''}${fresh.includes(b[1])?' pop':''}">${ic(on?b[0]:'lock')}</div><b>${b[1]}</b><small>${b[2]}</small></div>`}).join('')}</div>`}
function settings(){return `<div class="card"><b>Günlük kalori hedefi</b><input type="number" inputmode="numeric" value="${S.goal}" onchange="S.goal=Math.max(1000,+this.value||2000);save();render()"></div><div class="card"><b>Tema</b><div class="row3">${[['auto','Otomatik'],['light','Açık'],['dark','Koyu']].map(t=>`<button class="btn ${S.theme===t[0]?'':'s'}" onclick="setTheme('${t[0]}')">${t[1]}</button>`).join('')}</div></div><div class="card"><b>Renk paleti</b><div class="row3" style="grid-template-columns:1fr 1fr">${[['canli','Canlı'],['cini','Çini']].map(t=>`<button class="btn ${S.pal===t[0]?'':'s'}" onclick="setPal('${t[0]}')">${t[1]}</button>`).join('')}</div></div><div class="card"><b>Telefona kur</b><p style="margin:6px 0 0">Tarayıcı menüsünden "Ana ekrana ekle" de, uygulama gibi açılır.</p></div><button class="btn s" style="color:var(--r)" onclick="if(confirm('Tüm veriler silinsin mi?')){S={goal:2000,theme:'auto',pal:'canli',xp:0,entries:[],badges:[],q:{}};save();applyTheme();render()}">Tüm verileri sıfırla</button>`}
const TABS=[['today','home','Bugün'],['streak','flame','Seri'],['rew','trophy','Ödüller'],['set','gear','Ayarlar']];
function render(){const st=streak();
$('#app').innerHTML=`<div class="top"><div class="brand"><img class="lg" src="logo.png" alt="" onerror="this.onerror=function(){this.style.display='none'};this.src='icon-192.png'"><b>Kalori Serisi</b></div><button class="ic" onclick="cycle()" aria-label="Temayı değiştir">${ic({auto:'auto',light:'sun',dark:'moon'}[S.theme])}</button></div><div class="stats"><div class="pill" style="color:var(--o)">${ic('flame')} ${st} gün</div><div class="pill" style="color:var(--b)">${ic('bolt')} <span id="xp">${sx}</span> XP, Sv ${lvlOf(S.xp)}</div></div><div class="pg${fx?' in':''}">`+{today,streak:streakTab,rew:rewards,set:settings}[tab]()+`</div>`;fx=false;
$('#nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><span>${ic(t[1])}</span>${t[2]}</button>`).join('');countUp()}
applyTheme();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
