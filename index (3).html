return `<div class="card" style="border-radius:0;background:transparent;box-shadow:none;padding:6px 0 0"><div class="eyebrow">Bugünün ritmi</div><div class="welcome">Küçük adımlar,<br><span style="color:var(--g)">büyük değişimler.</span></div><p style="color:var(--mute);margin:8px 0 0;font-weight:500">Beslenmeni takip et, serini büyüt.</p></div><div class="card" style="text-align:center"><svg viewBox="0 0 120 120" width="190" height="190" role="img" aria-label="${tot} / ${S.goal} kcal"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="${p>1.1?'var(--o)':'var(--g)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(p,1))}" transform="rotate(-90 60 60)" style="animation:ring .9s cubic-bezier(.2,.8,.2,1)"/><text x="60" y="60" text-anchor="middle" font-size="24" font-weight="900" fill="var(--ink)">${tot}</text><text x="60" y="76" text-anchor="middle" font-size="9" fill="var(--mute)">/ ${S.goal} kcal</text></svg><div>${left>0?left+' kcal kaldı':left>-S.goal*.1?'Hedefe ulaştın!':-left+' kcal fazla, yarın yeni gün'}</div></div>
${te.some(e=>e.p||e.c||e.f)?`<div class="card"><div class="mc">${[['Protein','p','var(--b)'],['Karbonhidrat','c','var(--o)'],['Yağ','f','var(--g)']].map(m=>`<div><b style="color:${m[2]}">${Math.round(te.reduce((a,e)=>a+(e[m[1]]||0),0))} g</b><small>${m[0]}</small></div>`).join('')}</div></div>`:''}<div class="card"><div class="row"><b class="chip" style="font-size:16px">${ic('target')} Günlük görev: 3 farklı öğün</b><small>${Math.min(m,3)}/3</small></div><div class="bar" style="margin:10px 0 4px"><i style="width:${Math.min(m/3,1)*100}%;background:var(--o)"></i></div><small>Tamamla, +30 XP kazan</small></div><div class="card"><div class="row"><b class="chip" style="font-size:16px">${ic('drop')} Su</b><small>${S.w[t]||0}/8 bardak</small></div><div class="gl">${[...Array(8)].map((_,i)=>`<button class="dp ${i<(S.w[t]||0)?'on':''}" onclick="water(${i+1})" aria-label="${i+1}. bardak">${ic('drop')}</button>`).join('')}</div></div>`+
MEALS.map((n,i)=>{const L=te.filter(e=>e.meal===i);return `<div class="card"><div class="row"><b class="chip" style="font-size:16px">${ic(ICON[i])} ${n}</b><small>${L.reduce((a,e)=>a+e.kcal,0)} kcal</small></div>${L.map(e=>`<div class="ent">${e.photo?`<img src="${e.photo}" alt="${esc(e.name)}">`:'<span class="ph">'+ic('plate')+'</span>'}<div style="flex:1"><b>${esc(e.name)}</b><br><small>${e.kcal} kcal</small></div><button class="x" onclick="del(${e.id})" aria-label="Sil">✕</button></div>`).join('')}<button class="btn s" onclick="openAdd(${i})">+ Ekle</button></div>`}).join('')}
function streakTab(){const st=streak(),ds=dset();let cells='';for(let i=27;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=day(d);cells+=`<div class="dy ${ds.has(k)?'on':''} ${i==0?'td':''}">${ds.has(k)?'✓':d.getDate()}</div>`}
const ph=S.entries.filter(e=>e.photo).reverse().slice(0,30);
return `<div class="card" style="text-align:center">${tulip(st<1?0:st<3?1:st<7?2:3)}<div style="font-size:44px;font-weight:900;color:var(--o)">${st} gün</div><div>${st?'Seriyi sürdür, bugün de kaydet!':'Bugün ilk öğününü kaydet, seri başlasın'}</div><small>En uzun seri: ${best()} gün. Seri dondurma hakkı: ${S.fz}</small></div><div class="card"><b>Son 28 gün</b><div class="grid">${cells}</div></div><div class="card"><b>Son 7 gün</b>${weekChart()}<small>Kesikli çizgi günlük hedefin.</small></div><div class="card"><div class="row"><b>Lale bahçen</b><small>${dset().size} lale</small></div><div class="garden">${garden()}</div></div><div class="card"><b>Yemek günlüğü</b>${ph.length?`<div class="gal">${ph.map(e=>`<figure><img src="${e.photo}" alt="${esc(e.name)}"><figcaption>${e.date.slice(5)}</figcaption></figure>`).join('')}</div>`:'<p>Öğünlerine fotoğraf ekle, burada birikir.</p>'}</div>`}
function rewards(){const lv=lvlOf(S.xp),r=S.xp%100;return `<div class="card" style="text-align:center">${tulip(Math.min(lv-1,3))}<b style="font-size:22px">Seviye ${lv}</b><div class="bar" style="margin:10px 0"><i style="width:${r}%;background:var(--b)"></i></div><small>Sonraki seviyeye ${100-r} XP</small></div><div class="card"><div class="row"><b>Haftalık görev: 5 farklı gün kayıt</b><small>${Math.min(wdays(),5)}/5</small></div><div class="bar" style="margin:10px 0 4px"><i style="width:${Math.min(wdays()/5,1)*100}%"></i></div><small>+50 XP ve 1 seri dondurma. Her 7 günlük seride de 1 dondurma kazanırsın, kaçırdığın günü otomatik kurtarır.</small></div><div class="card"><b>XP nasıl kazanılır?</b><p style="margin:6px 0 0">Öğün +10, fotoğraf +5, günün ilk kaydı +25, 3 farklı öğün +30, rozet +50</p></div><div class="badges">${BD.map(b=>{const on=S.badges.includes(b[1]);return `<div class="bd ${on?'':'off'}"><div class="st ${on?'on':''}${fresh.includes(b[1])?' pop':''}">${ic(on?b[0]:'lock')}</div><b>${b[1]}</b><small>${b[2]}</small></div>`}).join('')}</div>`}
function settings(){return `<div class="card"><b>Günlük kalori hedefi</b><input type="number" inputmode="numeric" value="${S.goal}" onchange="S.goal=Math.max(1000,+this.value||2000);save();render()"></div><div class="card"><b>Tema</b><div class="row3">${[['auto','Otomatik'],['light','Açık'],['dark','Koyu']].map(t=>`<button class="btn ${S.theme===t[0]?'':'s'}" onclick="setTheme('${t[0]}')">${t[1]}</button>`).join('')}</div></div><div class="card"><b>Renk paleti</b><div class="row3" style="grid-template-columns:1fr 1fr">${[['canli','Canlı'],['cini','Çini']].map(t=>`<button class="btn ${S.pal===t[0]?'':'s'}" onclick="setPal('${t[0]}')">${t[1]}</button>`).join('')}</div></div><div class="card"><div class="row"><b>Sesler</b><button class="btn ${S.sound===false?'s':''}" style="width:auto;margin:0" onclick="toggleSound()">${S.sound===false?'Kapalı':'Açık'}</button></div></div><div class="card"><div class="row"><b>Ürünlerim</b><small>${Object.keys(S.cp).length}</small></div>${Object.keys(S.cp).map(k=>`<div class="ent"><div style="flex:1"><b>${esc(S.cp[k].n)}</b><br><small>${Math.round(S.cp[k].k)} kcal / 100 g</small></div><button class="x" onclick="delCp('${k}')" aria-label="Sil">✕</button></div>`).join('')||'<p>Bulunamayan ürünleri paketteki değerlerle kendi ürünün olarak kaydedebilirsin.</p>'}</div><div class="card"><b>Yedek</b><button class="btn b" onclick="backup()">Yedeği indir</button><label class="btn s">Yedekten geri yükle<input type="file" accept="application/json,.json" hidden onchange="restore(this)"></label></div><div class="card"><b>Telefona kur</b><p style="margin:6px 0 0">Tarayıcı menüsünden "Ana ekrana ekle" de, uygulama gibi açılır.</p></div><button class="btn s" style="color:var(--r)" onclick="if(confirm('Tüm veriler silinsin mi?')){S={goal:2000,theme:'auto',pal:'canli',xp:0,entries:[],badges:[],q:{},w:{},wk:{},fd:[],fz:0,cp:{}};save();applyTheme();render()}">Tüm verileri sıfırla</button>`}
const TABS=[['today','home','Bugün'],['streak','flame','Seri'],['rew','trophy','Ödüller'],['set','gear','Ayarlar']];
function render(){const st=streak(),lv=lvlOf(S.xp),todayEntries=S.entries.filter(e=>e.date===day()),todayKcal=todayEntries.reduce((a,e)=>a+e.kcal,0),progress=Math.min(100,Math.round(todayKcal/S.goal*100));
$('#app').innerHTML=`<div class="top"><div class="row"><div class="brand"><span class="brand-mark"><img src="kalori-logo.png" alt="Kalori Serisi" onerror="this.onerror=function(){this.style.display='none'};this.src='logo.png'"></span><b>Kalori Serisi</b></div><button class="ic" onclick="menu()" aria-label="Menü">${ic('menu')}</button></div></div><div class="pg${fx?' in':''}">`+{today,streak:streakTab,rew:rewards,set:settings}[tab]()+`</div>`;fx=false;
$('#nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><span>${ic(t[1])}</span>${t[2]}</button>`).join('');countUp()}
idbGet().then(d=>{if(d)Object.assign(S,d);else save();sx=S.xp;autoFreeze();applyTheme();render()});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
